name: "Terraform Integration & Security Checks"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    name: "Lint & Security Scans"
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7.5"

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.66.0

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ./cloud-infrastructure

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: ./cloud-infrastructure

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./cloud-infrastructure

      - name: Run TFLint
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" -f compact
        working-directory: ./cloud-infrastructure
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run Checkov Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          framework: terraform
          directory: cloud-infrastructure
