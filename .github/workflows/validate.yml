name: "Terraform Integration & Security Checks"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: "Lint & Security Scans"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.66.0

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ./cloud-infrastructure

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: ./cloud-infrastructure

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./cloud-infrastructure

      - name: Run TFLint
        run: |
          tflint --init
          tflint -f compact
        working-directory: ./cloud-infrastructure

      - name: Run Checkov Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          directory: cloud-infrastructure
          soft_fail: true # Evita que falle el pipeline completo por alertas menores durante el desarrollo